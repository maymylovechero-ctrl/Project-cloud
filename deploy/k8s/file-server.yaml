apiVersion: apps/v1
kind: Deployment
metadata:
  name: files
  namespace: fixflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: files }
  template:
    metadata:
      labels: { app: files }
    spec:
      containers:
        - name: files
          image: fixflow-files:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8081 }
          volumeMounts:
            - { name: uploads, mountPath: /usr/share/nginx/html/uploads, readOnly: true }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: uploaded-photos }
---
apiVersion: v1
kind: Service
metadata:
  name: files
  namespace: fixflow
spec:
  selector: { app: files }
  ports:
    - { name: http, port: 8081, targetPort: http }
