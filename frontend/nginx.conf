server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /health { access_log off; add_header Content-Type text/plain; return 200 'ok'; }
  location /api/ { proxy_pass http://api:3000/api/; proxy_http_version 1.1; proxy_set_header Host $host; }
  location /uploads/ { proxy_pass http://api:3000/uploads/; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }
}
